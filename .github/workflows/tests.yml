name: Simulador RTP - Testes Automatizados

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar suíte de testes unitários e invariantes
        run: python -m unittest discover -s simulador/tests -v

      - name: Executar cenário nacional completo (27 UFs x 12 Colunas)
        run: python simulador/rodar_cenario.py
